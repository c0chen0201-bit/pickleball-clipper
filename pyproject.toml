[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pickleball-clipper"
version = "0.1.0"
description = "Turn a full recorded pickleball game into a dead-time-free cut and a highlight reel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clip = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]
